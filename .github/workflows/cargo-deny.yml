# This workflow is managed by gh actions-lock.

name: cargo-deny

on:
  pull_request:
    paths:
      - '.github/workflows/cargo-deny.yml'
      - 'Cargo.lock'
      - 'deny.toml'

permissions:
  contents: read

jobs:
  cargo-deny:
    name: check
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: check
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          arguments: ''
