name: cargo-submit.yml
on:
  push:
    branches: [ "master" ]
    paths:
      - '.github/workflows/cargo-submit.yml'
      - 'Cargo.lock'

jobs:
  submit:
    permissions:
      contents: write # submission writes results into repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Component detection
        uses: advanced-security/component-detection-dependency-submission-action@v0.2.0
