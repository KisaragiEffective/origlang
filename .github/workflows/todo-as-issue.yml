# This workflow is managed by gh actions-lock.

name: "Run TODO to Issue"
on:
    push:
        branches:
            - master
jobs:
    build:
        permissions:
            contents: read
            issues: write
        runs-on: "ubuntu-26.04"
        steps:
            -
                uses: "actions/checkout@v7.0.1"
                with:
                    persist-credentials: false
            -
                  name: "TODO to Issue"
                  uses: "alstr/todo-to-issue-action@v5.1.15"
                  with:
                      AUTO_ASSIGN: true
